name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check for merging. Keep this job id/name "unit-tests".
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      # debug.keystore is not in git (see .gitignore); make a throwaway one so assembleDebug can sign.
      - name: Create CI debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          # Compiler errors, failed tests and Gradle's summary as annotations, readable on the PR page.
          grep -E "^e: |FAILED|What went wrong|Exception|expected:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Runs the app's instrumentation tests on an API 36 emulator. Separate job so a slow or flaky
  # emulator never blocks the required "unit-tests" check.
  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Create CI debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

